name: CI

on:
  push:
    branches:
      - master
      - codex/epic-01-*
      - codex/epic-02-*
      - codex/epic-03-*
      - codex/epic-04-*
      - codex/epic-05-*
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commodity_platform
          POSTGRES_USER: commodity_platform
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commodity_platform -d commodity_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: commodity_platform
      POSTGRES_USER: commodity_platform
      POSTGRES_PASSWORD: ci-database-password
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO via Docker Compose
        run: |
          cat << 'COMPOSE' > minio-compose.yml
          services:
            minio:
              image: public.ecr.aws/chainguard/minio:latest
              ports:
                - "9000:9000"
                - "9001:9001"
              environment:
                MINIO_ROOT_USER: minioadmin
                MINIO_ROOT_PASSWORD: minioadmin
              command: server /data --console-address ":9001"
              healthcheck:
                test: ["CMD", "mc", "ready", "local"]
                interval: 5s
                timeout: 5s
                retries: 5
          COMPOSE
          docker compose -f minio-compose.yml up -d --wait

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --all-extras --dev

      - name: Run backend lint
        working-directory: apps/api
        run: uv run python -m ruff check .

      - name: Run Django system checks
        working-directory: apps/api
        run: uv run python manage.py check --settings=config.settings.test

      - name: Verify migration consistency
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        working-directory: apps/api
        run: uv run python manage.py test --settings=config.settings.test --timing --durations 20

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    env:
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run lint
        working-directory: apps/web
        run: npm run lint

      - name: Run typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Run build
        working-directory: apps/web
        run: npm run build

      - name: Run frontend session regressions
        working-directory: apps/web
        run: npm test && npm run test:components

  contract:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: commodity_platform
      POSTGRES_USER: commodity_platform
      POSTGRES_PASSWORD: ci-database-password
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Regenerate TypeScript definitions
        working-directory: apps/web
        run: npm run api:generate

      - name: Check for uncommitted contract drift
        run: git diff --exit-code apps/web/src/lib/api/generated/schema.d.ts
