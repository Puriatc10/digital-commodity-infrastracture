name: CI

on:
  push:
    branches:
      - master
      - codex/epic-01-*
      - codex/epic-02-*
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commodity_platform
          POSTGRES_USER: commodity_platform
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commodity_platform -d commodity_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: commodity_platform
      POSTGRES_USER: commodity_platform
      POSTGRES_PASSWORD: ci-database-password
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
          pip check

      - name: Run backend lint
        working-directory: apps/api
        run: python -m ruff check .

      - name: Run Django system checks
        working-directory: apps/api
        run: python manage.py check

      - name: Verify migration consistency
        working-directory: apps/api
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: apps/api
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: apps/api
        run: python manage.py test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    env:
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run lint
        working-directory: apps/web
        run: npm run lint

      - name: Run typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Run build
        working-directory: apps/web
        run: npm run build

      - name: Run frontend session regressions
        working-directory: apps/web
        run: npm test && npm run test:components

  contract:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-ci-secret-key-do-not-use-in-production
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: commodity_platform
      POSTGRES_USER: commodity_platform
      POSTGRES_PASSWORD: ci-database-password
      API_PROXY_TARGET: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Regenerate TypeScript definitions
        working-directory: apps/web
        run: npm run api:generate

      - name: Check for uncommitted contract drift
        run: git diff --exit-code apps/web/src/lib/api/generated/schema.d.ts
