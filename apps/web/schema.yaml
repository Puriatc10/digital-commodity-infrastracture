openapi: 3.0.3
info:
  title: Commodity Platform API
  version: 0.1.0
  description: Backend OpenAPI for the commodity procurement platform
paths:
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfViewResponse'
          description: ''
  /api/auth/demo-switch:
    get:
      operationId: auth_demo_switch_list
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: auth_demo_switch_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoPersonaSwitcherRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/html:
              schema:
                type: string
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/html:
              schema:
                type: string
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/commodities/:
    get:
      operationId: commodities_list
      description: Return active usable Commodities in deterministic order.
      tags:
      - commodities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommodityDefinition'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/commodities/{code}/schema/:
    get:
      operationId: commodities_active_schema_retrieve
      description: Return the Commodity's explicitly selected active Published schema.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - commodities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommoditySchemaVersion'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/commodity-schemas/{id}/:
    get:
      operationId: commodity_schemas_retrieve
      description: |-
        Historical schema retrieval.
        Published and Retired schemas remain retrievable by stable ID.
        Draft definitions are internal and must not be exposed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - commodity-schemas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommoditySchemaVersion'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      description: Report process liveness without querying the database.
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/organizations/:
    get:
      operationId: organizations_list
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
  /api/organizations/{org_id}/verification/:
    get:
      operationId: organizations_verification_retrieve
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
  /api/organizations/{org_id}/verification/approve_basic/:
    post:
      operationId: organizations_verification_approve_basic_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/approve_full/:
    post:
      operationId: organizations_verification_approve_full_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/notes/:
    post:
      operationId: organizations_verification_notes_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationNote'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationNote'
          description: ''
  /api/organizations/{org_id}/verification/reject/:
    post:
      operationId: organizations_verification_reject_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/reopen/:
    post:
      operationId: organizations_verification_reopen_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/start_review/:
    post:
      operationId: organizations_verification_start_review_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/submit/:
    post:
      operationId: organizations_verification_submit_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{org_id}/verification/suspend/:
    post:
      operationId: organizations_verification_suspend_create
      parameters:
      - in: path
        name: org_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationAction'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationVerificationDetail'
          description: ''
        '400':
          description: Domain error (e.g. invalid transition)
        '409':
          description: Conflict (stale version)
  /api/organizations/{id}/:
    get:
      operationId: organizations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این organization را شناسایی میکند.
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    put:
      operationId: organizations_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این organization را شناسایی میکند.
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: organizations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این organization را شناسایی میکند.
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/organizations/{id}/add_commodity/:
    post:
      operationId: organizations_add_commodity_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این organization را شناسایی میکند.
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/organizations/{id}/remove_commodity/:
    delete:
      operationId: organizations_remove_commodity_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: یک رشته UUID که این organization را شناسایی میکند.
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/organizations/directory/:
    get:
      operationId: organizations_directory_list
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryOrganization'
          description: ''
components:
  schemas:
    CommodityAttributeDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: Canonical machine-readable key
          maxLength: 100
        label_fa:
          type: string
          description: Persian label
          maxLength: 255
        label_en:
          type: string
          description: English label
          maxLength: 255
        data_type:
          $ref: '#/components/schemas/DataTypeEnum'
        is_required:
          type: boolean
        unit_metadata:
          allOf:
          - $ref: '#/components/schemas/UnitMetadata'
          readOnly: true
        enum_metadata:
          allOf:
          - $ref: '#/components/schemas/EnumMetadata'
          readOnly: true
        validation_metadata:
          allOf:
          - $ref: '#/components/schemas/ValidationMetadata'
          readOnly: true
        display_group:
          type: string
          description: Logical group for UI presentation
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Deterministic sort order
      required:
      - data_type
      - enum_metadata
      - id
      - key
      - label_en
      - label_fa
      - unit_metadata
      - validation_metadata
    CommodityDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          description: Unique canonical code (e.g., bitumen)
          maxLength: 100
        name_fa:
          type: string
          description: Persian name
          maxLength: 255
        name_en:
          type: string
          description: English name
          maxLength: 255
        is_active:
          type: boolean
      required:
      - code
      - id
      - name_en
      - name_fa
    CommoditySchemaVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        commodity_id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Version number (e.g., 1, 2)
        status:
          $ref: '#/components/schemas/CommoditySchemaVersionStatusEnum'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/CommodityAttributeDefinition'
          readOnly: true
      required:
      - attributes
      - commodity_id
      - id
      - version
    CommoditySchemaVersionStatusEnum:
      enum:
      - draft
      - published
      - retired
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `retired` - Retired
    CsrfViewResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    DataTypeEnum:
      enum:
      - string
      - number
      - integer
      - boolean
      - enum
      type: string
      description: |-
        * `string` - String
        * `number` - Number
        * `integer` - Integer
        * `boolean` - Boolean
        * `enum` - Enum
    DemoPersonaSwitcherRequest:
      type: object
      properties:
        persona:
          $ref: '#/components/schemas/PersonaEnum'
      required:
      - persona
    DirectoryOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
          description: ISO 3166-1 alpha-2 country code
        capabilities:
          type: array
          items:
            type: string
          readOnly: true
        commodities:
          type: array
          items:
            type: string
          readOnly: true
        verification_status:
          type: string
          readOnly: true
      required:
      - capabilities
      - commodities
      - country
      - id
      - name
      - verification_status
    EnumMetadata:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/EnumOption'
    EnumOption:
      type: object
      properties:
        value:
          type: string
        label_fa:
          type: string
        label_en:
          type: string
        sort_order:
          type: integer
          minimum: 0
      required:
      - value
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        registration_identifier:
          type: string
          maxLength: 255
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 255
          - type: string
            maxLength: 0
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          maxLength: 2
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - name
      - updated_at
    OrganizationContext:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required:
      - capabilities
      - organization
      - role
    OrganizationVerificationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDecision'
          readOnly: true
        notes:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - decisions
      - id
      - notes
      - status
      - updated_at
      - version
    PatchedOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        registration_identifier:
          type: string
          maxLength: 255
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 255
          - type: string
            maxLength: 0
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          maxLength: 2
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PersonaEnum:
      enum:
      - buyer
      - supplier
      - broker
      - operator
      - admin
      type: string
      description: |-
        * `buyer` - buyer
        * `supplier` - supplier
        * `broker` - broker
        * `operator` - operator
        * `admin` - admin
    UnitMetadata:
      type: object
      properties:
        canonical_unit:
          type: string
        unit_family:
          type: string
        allowed_units:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        system_roles:
          type: array
          items:
            type: string
          readOnly: true
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationContext'
          readOnly: true
      required:
      - email
      - id
      - is_active
      - organizations
      - system_roles
    ValidationMetadata:
      type: object
      properties:
        minimum:
          type: number
          format: double
        maximum:
          type: number
          format: double
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 0
    VerificationAction:
      type: object
      properties:
        reason:
          type: string
        expected_version:
          type: integer
          nullable: true
    VerificationDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        previous_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        new_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_email
      - created_at
      - id
      - new_status
      - previous_status
      - reason
    VerificationNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_email
      - created_at
      - id
      - note
    VerificationStatusEnum:
      enum:
      - unverified
      - documents_submitted
      - under_review
      - basic_verified
      - verified
      - suspended
      type: string
      description: |-
        * `unverified` - Unverified
        * `documents_submitted` - Documents Submitted
        * `under_review` - Under Review
        * `basic_verified` - Basic Verified
        * `verified` - Verified
        * `suspended` - Suspended
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
