[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-platform-api"
version = "0.1.0"
description = "Django API foundation for the commodity procurement platform"
requires-python = ">=3.12"
dependencies = [
  "Django==6.0.8",
  "djangorestframework==3.18.1",
  "psycopg[binary]==3.3.5",
  "django-environ==0.14.0",
  "drf-spectacular==0.30.0",
  "jsonschema>=4.26.0",
  "minio>=7.2.20",
]

[tool.setuptools.packages.find]
include = ["config*", "identity*", "organizations*", "commodities*", "documents*"]

[project.optional-dependencies]
dev = ["ruff==0.16.6"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Django settings intentionally inherit the shared settings namespace.
"config/settings/local.py" = ["F405"]
"config/settings/production.py" = ["F405"]
